[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-delivery-platform"
version = "0.1.1"
description = "A Django service for learning reproducible delivery"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==6.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config", "config.*", "health", "health.*"]
namespaces = false